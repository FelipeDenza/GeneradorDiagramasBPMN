spring.application.name=bpmn-prompt-backend
spring.config.import=optional:file:.env[.properties],optional:file:IntegracionLLM/.env[.properties]
management.endpoints.web.exposure.include=health

llm.gemini.api-key=${GEMINI_API_KEY:}
llm.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
llm.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

llm.groq.api-key=${GROQ_API_KEY:}
llm.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
llm.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}

llm.openrouter.api-key=${OPENROUTER_API_KEY:}
llm.openrouter.model=${OPENROUTER_MODEL:openrouter/free}
llm.openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
